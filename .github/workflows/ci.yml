name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amanah
          POSTGRES_PASSWORD: amanah
          POSTGRES_DB: amanah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amanah -d amanah"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://amanah:amanah@localhost:5432/amanah
      TEST_DATABASE_URL: postgresql+asyncpg://amanah:amanah@localhost:5432/amanah_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Create the test database
        run: PGPASSWORD=amanah psql -h localhost -U amanah -d amanah -c "CREATE DATABASE amanah_test"
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Migrations apply to an empty database
        run: uv run alembic upgrade head
      - name: Tests
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t amanah-api .
