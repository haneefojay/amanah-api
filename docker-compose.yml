# Local development services: PostgreSQL and MinIO. The API itself runs with `uv run fastapi dev`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: amanah
      POSTGRES_DB: amanah
      # Local development only: no password, and the port is bound to this machine alone.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amanah -d amanah"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # Read from .env (copy .env.example). MinIO needs a password of at least 8 characters.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?copy .env.example to .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
